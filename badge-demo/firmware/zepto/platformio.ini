[platformio]
default_envs = zepto_blink
src_dir = .

[env]
platform = ./platforms/zepto-mspm0
board = zeptomspm0l1117
framework = baremetal
upload_protocol = custom
build_flags =
  -ffreestanding
  -fdata-sections
  -ffunction-sections
  -fno-jump-tables
  -Wall
  -Wextra
  -DZEPTO_I2C_ECHO_ADDR=0x33
  -DZEPTO_CPU_HZ=32000000UL
build_src_filter =
  -<*>
  +<src/*.c>
upload_command = ${PROJECT_DIR}/scripts/flash_zepto_bsl.sh ${PROJECT_DIR}/.pio/build/${PIOENV}/firmware.bin

[env:zepto_blink]
build_src_filter =
  ${env.build_src_filter}
  +<examples/baremetal/blink/src/*.c>
build_flags =
  ${env.build_flags}
  -DZEPTO_APP_BLINK=1

[env:zepto_badgesnake]
build_src_filter =
  ${env.build_src_filter}
  +<examples/baremetal/badgesnake/src/*.c>
build_flags =
  ${env.build_flags}
  -DZEPTO_APP_BADGESNAKE=1
  -DZEPTO_BADGESNAKE_I2C_ADDR=0x42

[env:zepto_badgesnake_unicomm]
build_src_filter =
  ${env:zepto_badgesnake.build_src_filter}
build_flags =
  ${env:zepto_badgesnake.build_flags}
  -DZEPTO_I2C_TARGET_USE_UNICOMM=1

[env:zepto_qwiic_sda_low]
build_src_filter =
  ${env.build_src_filter}
  +<examples/baremetal/qwiic_diag/src/*.c>
build_flags =
  ${env.build_flags}
  -DZEPTO_QWIIC_DIAG_HOLD_SDA=1

[env:zepto_qwiic_scl_low]
build_src_filter =
  ${env.build_src_filter}
  +<examples/baremetal/qwiic_diag/src/*.c>
build_flags =
  ${env.build_flags}
  -DZEPTO_QWIIC_DIAG_HOLD_SCL=1

[env:zepto_i2c_target_diag_stage0]
build_src_filter =
  ${env.build_src_filter}
  +<examples/baremetal/i2c_target_diag/src/*.c>
build_flags =
  ${env.build_flags}
  -DZEPTO_I2C_DIAG_STAGE=0
  -DZEPTO_I2C_DIAG_ADDR=0x42

[env:zepto_i2c_target_diag_stage1]
build_src_filter =
  ${env:zepto_i2c_target_diag_stage0.build_src_filter}
build_flags =
  ${env.build_flags}
  -DZEPTO_I2C_DIAG_ADDR=0x42
  -DZEPTO_I2C_DIAG_STAGE=1

[env:zepto_i2c_target_diag_stage2]
build_src_filter =
  ${env:zepto_i2c_target_diag_stage0.build_src_filter}
build_flags =
  ${env.build_flags}
  -DZEPTO_I2C_DIAG_ADDR=0x42
  -DZEPTO_I2C_DIAG_STAGE=2

[env:zepto_i2c_target_diag_stage3]
build_src_filter =
  ${env:zepto_i2c_target_diag_stage0.build_src_filter}
build_flags =
  ${env.build_flags}
  -DZEPTO_I2C_DIAG_ADDR=0x42
  -DZEPTO_I2C_DIAG_STAGE=3

[env:zepto_i2c_target_diag_stage4]
build_src_filter =
  ${env:zepto_i2c_target_diag_stage0.build_src_filter}
build_flags =
  ${env.build_flags}
  -DZEPTO_I2C_DIAG_ADDR=0x42
  -DZEPTO_I2C_DIAG_STAGE=4

[env:zepto_i2c_target_diag_stage5]
build_src_filter =
  ${env:zepto_i2c_target_diag_stage0.build_src_filter}
build_flags =
  ${env.build_flags}
  -DZEPTO_I2C_DIAG_ADDR=0x42
  -DZEPTO_I2C_DIAG_STAGE=5

[env:zepto_i2c_target_diag_stage6]
build_src_filter =
  ${env:zepto_i2c_target_diag_stage0.build_src_filter}
build_flags =
  ${env.build_flags}
  -DZEPTO_I2C_DIAG_ADDR=0x42
  -DZEPTO_I2C_DIAG_STAGE=6

[env:zepto_i2c_target_diag_stage6_unicomm]
build_src_filter =
